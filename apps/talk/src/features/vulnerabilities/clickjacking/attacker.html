<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Бонус за покупку</title>
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; font: 16px/1.5 Arial, sans-serif; color: #232b37; background: #fff; border-top: 4px solid #ffab40; }
    main { width: min(100% - 32px, 640px); margin: 36px auto; }
    header { color: #647084; font-size: 14px; border-bottom: 1px solid #e8edf5; padding-bottom: 16px; }
    h1 { color: #05358c; font-size: 28px; margin: 24px 0; }
    img { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 0 24px; }
    label { display: inline-block; margin-bottom: 20px; cursor: pointer; }
    input { accent-color: #0097a7; width: 18px; height: 18px; vertical-align: middle; }
    .attack-stage { position: relative; width: 100%; max-width: 320px; height: 240px; background: #f3f6fa; }
    .attack-stage iframe { width: 100%; height: 240px; border: 0; }
    #bonus { position: absolute; top: 140px; left: 24px; width: calc(100% - 48px); height: 48px; }
    .attack-stage h2 { position: absolute; top: 24px; left: 24px; right: 24px; margin: 0; font-size: 22px; color: #05358c; }
    .attack-stage p { position: absolute; top: 76px; left: 24px; margin: 0; }
    button { border: 0; border-radius: 4px; background: #ffab40; color: #232b37; font: 600 16px Arial, sans-serif; cursor: pointer; }
    #reveal:checked ~ .attack-stage iframe { opacity: 1 !important; }
    footer { margin-top: 24px; border-top: 1px solid #e8edf5; padding-top: 20px; }
    a { color: #05358c; }
  </style>
</head>
<body><main>
  <header>Акции партнёров</header>
  <h1>Бонус за покупку</h1>
  <img src="/catalog.png" alt="Каталог электротехнической продукции" width="420" height="300">
  <input type="checkbox" id="reveal">
  <label for="reveal">Показать скрытый iframe</label>
  {{ATTACK_LAYER}}
  <footer><a href="{{SHOP_ORIGIN}}/site/notifications">Вернуться в профиль магазина</a></footer>
</main></body>
</html>
